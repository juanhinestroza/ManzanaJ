@media (prefers-color-scheme: dark) {

    --filete: #2B2F24;

}

}

.aviso { padding-block: 2.5rem; display: grid; gap: 1rem; justify-items: start; }

.fin { padding-block: 1rem 3rem; display: grid; gap: 2rem; justify-items: center; }

      }
      ctx.globalCompositeOperation = "destination-out";
      var mordida = [[cx + A * 1.1, cy + A * 0.02, A * 0.27], [cx + A * 1.02, cy - A * 0.34, A * 0.2], [cx + A * 1.02, cy + A * 0.38, A * 0.21]];
      ctx.fillStyle = "rgba(0,0,0,1)";
      mordida.forEach(function (m) { ctx.beginPath(); ctx.arc(m[0], m[1], m[2], 0, Math.PI * 2); ctx.fill(); });
      ctx.restore();
    });
    pasos.push(function () {
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      for (var pase = 0; pase < 2; pase++) {
        ctx.strokeStyle = rgba(tinta, pase ? 0.35 : 0.8);
        ctx.lineWidth = Math.max(1, S * (pase ? 0.003 : 0.0045));
        ctx.beginPath();
        var primero = true;
        for (var t = 0.62; t <= Math.PI * 2 - 0.5; t += 0.05) {
          var th = t;
          var abolladura = 0.2 * Math.exp(-Math.pow(th - Math.PI * 1.5, 2) / 0.05) + 0.06 * Math.exp(-Math.pow(th - Math.PI * 0.5, 2) / 0.1);
          var r = 1 - abolladura + (R() - 0.5) * 0.018;
          var x = cx + S * 0.012 + Math.cos(th) * A * 1.1 * r;
          var y = cy - S * 0.008 + Math.sin(th) * A * (th > Math.PI ? 0.86 : 0.92) * r;
          if (primero) { ctx.moveTo(x, y); primero = false; } else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      ctx.strokeStyle = rgba(tinta, 0.55);
      ctx.lineWidth = Math.max(1, S * 0.003);
      [[cx + A * 1.1, cy + A * 0.02, A * 0.27, 2.2, 4.1], [cx + A * 1.02, cy - A * 0.34, A * 0.2, 2.0, 3.6], [cx + A * 1.02, cy + A * 0.38, A * 0.21, 2.6, 4.3]].forEach(function (m) {
        ctx.beginPath(); ctx.arc(m[0], m[1], m[2], m[3], m[4]); ctx.stroke();
      });
      ctx.restore();
    });
    if (conTallo) {
      pasos.push(function () {
        for (var i = 0; i < 16; i++) {
          mancha(ctx, cx + A * 0.48, cy - A * 1.2, A * 0.34, A * 0.12, R, 0.18, -0.55);
          ctx.fillStyle = rgba(verde, 0.06 + R() * 0.04);
          ctx.fill();
        }
        ctx.strokeStyle = rgba(tinta, 0.5);
        ctx.lineWidth = Math.max(1, S * 0.0025);
        ctx.beginPath();
        ctx.moveTo(cx + A * 0.2, cy - A * 1.0);
        ctx.quadraticCurveTo(cx + A * 0.5, cy - A * 1.24, cx + A * 0.78, cy - A * 1.4);
        ctx.stroke();
      });
      pasos.push(function () {
        ctx.save();
        var tam = A * 1.05;
        ctx.font = tam + 'px "Gloock", Georgia, serif';
        ctx.textBaseline = "alphabetic";
        ctx.translate(cx + A * 0.02, cy - A * 0.78);
        ctx.rotate(-0.12);
        ctx.fillStyle = rgba(tinta, 0.92);
        ctx.fillText("J", -tam * 0.18, 0);
        ctx.restore();
      });
    }
    return pasos;
  }

  function pintar(canvas, pasos, animar) {
    if (!animar || sinMovimiento) { pasos.forEach(function (p) { p(); }); return; }
    var i = 0;
    (function cuadro() {
      for (var k = 0; k < 2 && i < pasos.length; k++) pasos[i++]();
      if (i < pasos.length) requestAnimationFrame(cuadro);
    })();
  }

  function pintarManchita(canvas, nombreColor, semilla) {
    var p = preparar(canvas), ctx = p.ctx, S = p.S;
    var R = azar(semilla);
    var c = rgb(token("--" + (nombreColor || "manzana")) || token("--manzana"));
    for (var i = 0; i < 16; i++) {
      mancha(ctx, S / 2 + (R() - 0.5) * S * 0.08, S / 2 + (R() - 0.5) * S * 0.08, S * 0.36, S * 0.32, R, 0.3, R() * 3);
      ctx.fillStyle = rgba(c, 0.07 + R() * 0.06);
      ctx.fill();
    }
  }

  function grano() {
    var c = document.createElement("canvas");
    c.width = c.height = 180;
    var ctx = c.getContext("2d");
    var t = rgb(token("--tinta")), R = azar(99);
    for (var i = 0; i < 2600; i++) {
      ctx.fillStyle = rgba(t, R() * 0.05);
      ctx.fillRect(R() * 180, R() * 180, 1, 1);
    }
    try { document.body.style.backgroundImage = "url(" + c.toDataURL() + ")"; } catch (e) {}
  }

  function pintarTodo(animar) {
    var portada = $("manzana");
    if (portada && !vistaIndice.hidden) { var p = preparar(portada); pintar(portada, pasosManzana(p.ctx, p.S, true), animar); }
    var fin = $("manzana-fin");
    if (fin && !vistaLector.hidden) { var f = preparar(fin); pintar(fin, pasosManzana(f.ctx, f.S, true), false); }
    document.querySelectorAll("canvas.mancha").forEach(function (c) { pintarManchita(c, c.dataset.color, Number(c.dataset.semilla)); });
    grano();
  }

  /* ---------- Índice ---------- */
  function pintarIndice() {
    var lista = $("lista");
    lista.textContent = "";
    $("conteo").textContent = catalogo.length + (catalogo.length === 1 ? " texto" : " textos");
    $("anio-pie").textContent = String(new Date().getFullYear());
    if (!catalogo.length) { lista.appendChild(el("li", "vacio", "Todavía no hay escritos publicados.")); return; }
    catalogo.forEach(function (o) {
      var li = el("li");
      var a = el("a", "entrada");
      a.href = "#" + o.slug;
      var m = el("canvas", "mancha");
      m.setAttribute("aria-hidden", "true");
      m.dataset.color = o.color || "manzana";
      m.dataset.semilla = String(semillaDe(o.slug));
      a.appendChild(m);
      var renglon = el("span", "renglon");
      renglon.appendChild(el("span", "titulo", o.titulo));
      renglon.appendChild(el("span", "puntos"));
      renglon.appendChild(el("span", "maquina pp", o.paginas ? o.paginas + " pp." : ""));
      a.appendChild(renglon);
      a.appendChild(el("p", "maquina datos", o.genero + " · Publicado el " + fechaLarga(o.publicado)));
      if (o.sinopsis) a.appendChild(el("p", "sinopsis", o.sinopsis));
      li.appendChild(a);
      lista.appendChild(li);
    });
  }

  /* ---------- Lector ---------- */
  var actual = null, turno = 0, docPdf = null, bytesPdf = null, anchoPintado = 0;

  function mostrarIndice(animar) {
    actual = null;
    turno++;
    vistaLector.hidden = true;
    vistaIndice.hidden = false;
    document.title = NOMBRE_SITIO;
    pintarTodo(animar);
  }

  function mostrarLector(o) {
    actual = o;
    var miTurno = ++turno;
    vistaIndice.hidden = true;
    vistaLector.hidden = false;
    window.scrollTo(0, 0);
    document.title = o.titulo + " · " + NOMBRE_SITIO;
    $("obra-datos").textContent = datosObra(o);
    $("obra-titulo").textContent = o.titulo;
    $("obra-sinopsis").textContent = o.sinopsis || "";
    $("hojas").textContent = "";
    $("fin").hidden = true;
    $("error").hidden = true;
    $("cargando").hidden = false;
    pintarVecinos(o);
    docPdf = null;
    bytesPdf = null;

    if (!window.pdfjsLib) { fallo(miTurno); return; }

    fetch(o.archivo)
      .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.arrayBuffer(); })
      .then(function (buf) {
        if (miTurno !== turno) return null;
        bytesPdf = buf;
        return pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
      })
      .then(function (doc) {
        if (!doc || miTurno !== turno) return;
        docPdf = doc;
        $("cargando").hidden = true;
        return pintarHojas(doc, miTurno);
      })
      .then(function () {
        if (miTurno === turno && docPdf) { $("fin").hidden = false; pintarTodo(false); }
      })
      .catch(function () { fallo(miTurno); });
  }

  function fallo(miTurno) {
    if (miTurno !== turno) return;
    $("cargando").hidden = true;
    $("error").hidden = false;
  }

  function pintarHojas(doc, miTurno) {
    var cont = $("hojas");
    cont.textContent = "";
    var hojas = [];
    for (var i = 1; i <= doc.numPages; i++) {
      var h = el("figure", "hoja");
      var lienzo = el("div", "lienzo");
      lienzo.style.aspectRatio = "148 / 210";
      var c = document.createElement("canvas");
      c.setAttribute("aria-label", "Página " + i + " de " + doc.numPages);
      lienzo.appendChild(c);
      h.appendChild(lienzo);
      h.appendChild(el("figcaption", "maquina folio", i + " / " + doc.numPages));
      cont.appendChild(h);
      hojas.push(h);
    }
    anchoPintado = cont.clientWidth;
    var cadena = Promise.resolve();
    hojas.forEach(function (h, idx) {
      cadena = cadena.then(function () {
        if (miTurno !== turno) return;
        return doc.getPage(idx + 1).then(function (pagina) {
          if (miTurno !== turno) return;
          var lienzo = h.querySelector(".lienzo");
          var base = pagina.getViewport({ scale: 1 });
          lienzo.style.aspectRatio = base.width + " / " + base.height;
          var ancho = Math.min(lienzo.clientWidth || cont.clientWidth, 576);
          var dpr = Math.min(window.devicePixelRatio || 1, 3);
          var vp = pagina.getViewport({ scale: (ancho / base.width) * dpr });
          var c = h.querySelector("canvas");
          c.width = Math.floor(vp.width);
          c.height = Math.floor(vp.height);
          return pagina.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise.then(function () {
            h.classList.add("lista-hoja");
          });
        });
      });
    });
    return cadena;
  }

  function pintarVecinos(o) {
    var nav = $("vecinos");
    nav.textContent = "";
    var i = catalogo.indexOf(o);
    var anterior = catalogo[i + 1], siguiente = catalogo[i - 1];
    if (anterior) nav.appendChild(enlaceVecino(anterior, "← Anterior"));
    if (siguiente) nav.appendChild(enlaceVecino(siguiente, "Siguiente →"));
    if (!anterior && !siguiente) {
      var a = el("a");
      a.href = "#";
      a.appendChild(el("span", "maquina", "Volver"));
      a.appendChild(el("span", "t", "Índice de escritos"));
      nav.appendChild(a);
    }
  }
  function enlaceVecino(o, etiqueta) {
    var a = el("a");
    a.href = "#" + o.slug;
    a.appendChild(el("span", "maquina", etiqueta));
    a.appendChild(el("span", "t", o.titulo));
    return a;
  }

  var espera = null, anchoVentana = window.innerWidth;
  window.addEventListener("resize", function () {
    clearTimeout(espera);
    espera = setTimeout(function () {
      if (Math.abs(window.innerWidth - anchoVentana) < 20) return;
      anchoVentana = window.innerWidth;
      pintarTodo(false);
      if (!docPdf || vistaLector.hidden) return;
      var w = $("hojas").clientWidth;
      if (Math.abs(w - anchoPintado) < 40) return;
      var miTurno = ++turno;
      pintarHojas(docPdf, miTurno);
    }, 250);
  });

  function alCambiarTema() { pintarTodo(false); }
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", alCambiarTema);
  }
  new MutationObserver(alCambiarTema).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  $("reintentar").addEventListener("click", function () { if (actual) mostrarLector(actual); });
  $("volver").addEventListener("click", function (e) {
    e.preventDefault();
    if (location.hash) location.hash = ""; else mostrarIndice(false);
  });

  /* ---------- Rutas ---------- */
  function enrutar(animar) {
    var slug = decodeURIComponent(location.hash.replace(/^#/, ""));
    var obra = null;
    for (var i = 0; i < catalogo.length; i++) if (catalogo[i].slug === slug) obra = catalogo[i];
    if (obra) mostrarLector(obra); else mostrarIndice(animar === true);
  }
  window.addEventListener("hashchange", function () { enrutar(false); });
  pintarIndice();
  enrutar(false);
  var fuentes = document.fonts && document.fonts.load ? document.fonts.load('80px "Gloock"') : Promise.resolve();
  fuentes.then(function () { if (!vistaIndice.hidden) pintarTodo(true); }, function () {});
})();
</script>

</body></html>
